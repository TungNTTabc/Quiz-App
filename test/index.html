<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>

<div class="screen" id="screen-welcome">
    <div class="container">
        <h1 class="heading">Quiz App</h1>
        <p class="welcome-sub">Welcome to Quiz App</p>
        <button class="btn" id="btn-go-login">Login</button>
        <button class="btn btn-secondary" id="btn-go-register">Register</button>
    </div>
</div>

<div class="screen hide" id="screen-register">
    <div class="container">
        <h1 class="heading">Register</h1>
        <div class="setting">
            <label>Username</label>
            <input type="text" class="auth-input" id="reg-username" placeholder="Choose a username" autocomplete="off">
            <label>Password</label>
            <input type="password" class="auth-input" id="reg-password" placeholder="Choose a password">
        </div>
        <p class="auth-error hide" id="reg-error">Your username/password has already been used</p>
        <button class="btn" id="btn-register">Register</button>
        <button class="btn btn-secondary" id="btn-reg-return">Return</button>
    </div>
</div>

<div class="screen hide" id="screen-login">
    <div class="container">
        <h1 class="heading">Login</h1>
        <div class="setting">
            <label>Username</label>
            <input type="text" class="auth-input" id="login-username" placeholder="Enter your username" autocomplete="off">
            <label>Password</label>
            <input type="password" class="auth-input" id="login-password" placeholder="Enter your password">
        </div>
        <p class="auth-error hide" id="login-error">Wrong username/password</p>
        <button class="btn" id="btn-login">Login</button>
        <button class="btn btn-secondary" id="btn-login-return">Return</button>
    </div>
</div>

<div class="screen hide" id="screen-start">
    <div class="app-layout">

        <div class="note-board">
            <h2>Notes</h2>
            <textarea id="note-text" placeholder="Write your notes here..."></textarea>
            <div class="note-buttons">
                <button id="save-note">Save</button>
                <button id="hide-note">Hide</button>
            </div>
        </div>

        <div class="container">
            <h1 class="heading">Quiz App</h1>
            <div class="setting">
                <label for="num-questions">Number of Questions</label>
                <select id="num-questions">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="25">25</option>
                    <option value="30">30</option>
                </select>
                <label for="category">Select category</label>
                <select id="category">
                    <option value="">any category</option>
                    <option value="1">prepared question</option>
                    <option value="9">general knowledge</option>
                    <option value="10">books</option>
                    <option value="11">films</option>
                    <option value="12">music</option>
                    <option value="14">television</option>
                    <option value="15">video games</option>
                    <option value="16">board games</option>
                    <option value="17">science and nature</option>
                    <option value="18">computers</option>
                    <option value="19">mathematics</option>
                    <option value="20">mythology</option>
                    <option value="21">sports</option>
                    <option value="22">geography</option>
                    <option value="23">history</option>
                    <option value="24">politics</option>
                    <option value="25">art</option>
                    <option value="28">vehicles</option>
                </select>
                <label for="difficulty">Select difficulty</label>
                <select id="difficulty">
                    <option value="">any difficulty</option>
                    <option value="easy">easy</option>
                    <option value="medium">medium</option>
                    <option value="hard">hard</option>
                </select>
                <label for="time">Select time per Question</label>
                <select id="time">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="45">45</option>
                    <option value="60">60</option>
                </select>
            </div>
            <button class="btn start" id="btn-start">Start quiz</button>
        </div>

        <div class="leaderboard" id="stats-panel">
            <h2>Player Stats</h2>
            <div id="stats-content">
                <p style="color:#a2aace;font-size:13px;text-align:center;margin-top:10px;">No data yet. Play a game!</p>
            </div>
        </div>

    </div>
</div>

<div class="screen hide" id="screen-quiz">
    <div class="app-layout">

        <div class="note-board">
            <h2>Notes</h2>
            <textarea id="note-text-quiz" placeholder="Write your notes here..."></textarea>
            <div class="note-buttons">
                <button id="save-note-quiz">Save</button>
                <button id="hide-note-quiz">Hide</button>
            </div>
        </div>

        <div class="container">
            <div class="timer">
                <div class="progress">
                    <div class="progress-bar"></div>
                    <span class="progress-text"></span>
                </div>
            </div>
            <div class="question-wapper">
                <div class="number">
                    Question <span class="current">1</span><span class="total">/10</span>
                </div>
                <div class="question">Loading...</div>
            </div>
            <div class="answer-wapper"></div>
            <button class="btn submit" disabled>Submit</button>
            <button class="btn next">Next</button>
        </div>

        <div class="leaderboard">
            <h2>Top 10 Scores</h2>
            <ul id="leaderboard-list"></ul>
        </div>

    </div>
</div>

<div class="screen hide" id="screen-end">
    <div class="container">
        <h1 class="heading">Quiz App</h1>
        <div class="score">
            <span class="score-text">Your Score:</span>
            <div>
                <span class="final-score">0</span>
                <span class="total-score">/ 10</span>
            </div>
            <button class="btn restart">Restart Quiz</button>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
